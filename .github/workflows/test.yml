name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared project
        run: pnpm run build
        working-directory: ./shared

      # The checks below each run even when an earlier one fails, so a stray
      # formatting nit still reports the lint, typecheck and test results.
      - name: Format
        run: pnpm run prettier:check

      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: pnpm run test
